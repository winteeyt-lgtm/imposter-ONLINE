// ===== состояние =====
const $=document.getElementById("app");
const load=()=>{try{return JSON.parse(localStorage.getItem("imp"))||{}}catch(e){return{}}};
const st=Object.assign({mode:"items",dark:true,vib:true,snd:true,n:4,cat:"Все",recent:[]},load());
const save=()=>{try{localStorage.setItem("imp",JSON.stringify(st))}catch(e){}};
let G=null,D=false,P='mode',CUR='',O={list:[]};
const rnd=n=>{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n};
function theme(){document.documentElement.classList.toggle("dark",st.dark)}
function beep(f=520){if(!st.snd)return;try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=f;g.gain.value=.08;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.12)}catch(e){}}
function vib(){if(st.vib&&navigator.vibrate)navigator.vibrate(70)}

function pick(){
  const L=st.mode==="loc",k=L?"recentL":"recent";st[k]=st[k]||[];
  const pool=L?LOCW:WORDS.filter(x=>st.cat==="Все"||x.c===st.cat);
  let free=pool.filter(x=>!st[k].includes(x.w));
  if(!free.length){st[k]=st[k].filter(w=>!pool.some(x=>x.w===w));free=pool}
  const x=free[rnd(free.length)];
  st[k].push(x.w);if(st[k].length>(L?100:50))st[k].shift();save();return x;
}
function newRound(){G={word:pick(),imp:rnd(st.n),i:0};go("pass")}

`<div class="logo">🕵️</div><div class="big role">ТЫ ИМПОСТЕР</div><p>Попробуй понять, какое слово загадано другими игроками.</p>`:
`<div class="role">ТЫ МИРНЫЙ</div><div class="big">${c} ${G.word.w.toUpperCase()}</div><p>Запомни слово и не показывай его другим.</p>`}</div>
<button class="pri" onclick="ok()">ПОНЯТНО</button>`},

<p>Теперь начинайте игру! Каждый по очереди должен сказать что-то о ${st.mode==="loc"?"загаданном месте":"загаданном предмете"} или нарисовать небольшую его деталь. Импостер должен догадаться, какое слово загадано.</p></div>
<div class="bot"><button class="pri" onclick="newRound()">НОВЫЙ РАУНД</button><button onclick="go('mode')">НА ГЛАВНУЮ</button></div>`,

<button class="pri" onclick="go(P)">Назад</button>`
};
function pn(n){st.n=n;save();document.querySelectorAll('.pl button').forEach(b=>b.classList.toggle('on',+b.textContent===n))}
function sm(m){st.mode=m;save();go('menu')}
function go(s){CUR=s;if(s!=='menu')D=false;if(s!=='settings')P=s;$.innerHTML=V[s]()}
function tg(){st.dark=!st.dark;save();theme();if(!G||true){/* перерисуется вызывающим */}}
function reveal(){vib();beep(660);go("role")}
function ok(){beep(440);G.i++;go(G.i>=st.n?"done":"pass")}

// ===== ОНЛАЙН (Firebase Realtime Database, бесплатный Spark) =====
// ВСТАВЬТЕ СЮДА URL вашей Realtime Database из Firebase Console:
const FIREBASE_DB_URL = "https://imposter-game-d31b2-default-rtdb.firebaseio.com";
let pollTimer=null, heartbeatTimer=null, pollBusy=false, lastStateKey="", lastPlayersKey="";
const myId = "p_" + Array.from(crypto.getRandomValues(new Uint8Array(12))).map(x=>x.toString(16).padStart(2,"0")).join("");
const roomUrl = path => FIREBASE_DB_URL.replace(/\/+$/,"") + "/" + path + ".json";
async function dbGet(path){
  const r=await fetch(roomUrl(path),{cache:"no-store"});
  if(!r.ok) throw new Error("Firebase HTTP "+r.status);
  return r.json();
}
async function dbPut(path,value){
  const r=await fetch(roomUrl(path),{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(value)});
  if(!r.ok) throw new Error("Firebase HTTP "+r.status);
  return r.json();
}
async function dbPatch(path,value){
  const r=await fetch(roomUrl(path),{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(value)});
  if(!r.ok) throw new Error("Firebase HTTP "+r.status);
  return r.json();
}
async function dbDelete(path){
  const r=await fetch(roomUrl(path),{method:"DELETE"});
  if(!r.ok) throw new Error("Firebase HTTP "+r.status);
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const setErr=m=>{const e=document.getElementById("er");if(e)e.textContent=m};
const getNick=()=>{const v=(document.getElementById("nm")||{}).value;const n=(v||"").trim().slice(0,12)||"Игрок";st.nick=n;save();return n};
function firebaseReady(){
  if(!/^https:\/\/.+\.(?:firebasedatabase\.app|firebaseio\.com)$/i.test(FIREBASE_DB_URL))
    throw new Error("Сначала укажите URL Firebase Realtime Database в файле");
}
function stopPolling(){
  if(pollTimer)clearInterval(pollTimer);
  if(heartbeatTimer)clearInterval(heartbeatTimer);
  pollTimer=heartbeatTimer=null;pollBusy=false;lastStateKey="";lastPlayersKey="";
}
function goOnline(){O.pre=null;go("onl")}
async function closeNet(){
  stopPolling();
  const old=O;
  O={list:[]};
  if(old.host&&old.code){try{await dbDelete("rooms/"+old.code)}catch(e){}}
  else if(old.code&&old.playerId){try{await dbDelete("rooms/"+old.code+"/players/"+old.playerId)}catch(e){}}
}
async function leave(){await closeNet();go("onl")}
V.onl=()=>`<div class="s"><div class="logo">🌐</div><h2>Онлайн-игра</h2><p>Каждый играет на своём телефоне</p>
<input id="nm" maxlength="12" placeholder="Ваш ник" value="${esc(st.nick||"")}">
${O.pre?`<p>Комната <b>${O.pre}</b></p><button class="pri" onclick="joinRoom('${O.pre}')">ВОЙТИ В КОМНАТУ</button>`:`<button class="pri" onclick="makeRoom()">СОЗДАТЬ КОМНАТУ</button><input id="cd" maxlength="4" placeholder="Код комнаты" style="text-transform:uppercase"><button onclick="joinRoom()">ВОЙТИ ПО КОДУ</button>`}
<p id="er" class="err"></p></div><button onclick="O.pre=null;go('mode')">Назад</button>`;
V.lobby=()=>{const H=O.host;return `<div class="s"><h2>Комната <span class="role">${O.code}</span></h2>
${H?`<p>Отправьте друзьям ссылку или код</p><button onclick="share()">📋 ПОДЕЛИТЬСЯ ССЫЛКОЙ</button>`:`<p>Ждём, пока главный начнёт игру…</p>`}
<div class="plist">${O.list.map((n,i)=>`<div class="row">${i===0?"👑 ":""}${esc(n)}</div>`).join("")}</div>
<p>Игроков: ${O.list.length} (нужно от 3 до 8)</p>
${H?`<div class="grid" style="grid-template-columns:1fr 1fr"><button class="${st.mode==="items"?"on":""}" onclick="st.mode='items';save();go('lobby')">Предметы</button><button class="${st.mode==="loc"?"on":""}" onclick="st.mode='loc';save();go('lobby')">Локации</button></div>
${st.mode==="items"?`<select onchange="st.cat=this.value;save()"><option value="Все">Все категории</option>${CATS.map(c=>`<option ${c===st.cat?"selected":""}>${c}</option>`).join("")}</select>`:""}`:""}</div>
<div class="bot">${H?`<button class="pri" ${O.list.length<3?"disabled":""} onclick="onlineStart()">НАЧАТЬ ИГРУ</button>`:""}<button onclick="leave()">Выйти</button></div>`};
V.orole=()=>{const m=O.me;if(!m)return V.onl();return `<div class="s"><p>Раунд ${m.round} · игроков: ${O.list.length}</p>
${O.rev&&O.ans?`<div class="role">ОТВЕТ</div><h2>Импостер: ${esc(O.ans.imp)}</h2><div class="big">${esc(O.ans.word)}</div>`:O.show?(m.imp?`<div class="logo">🕵️</div><div class="big role">ТЫ ИМПОСТЕР</div><p>Попробуй понять, какое слово загадано другими игроками.</p>`:`<div class="role">ТЫ МИРНЫЙ</div><div class="big">${esc(m.emo)} ${esc(m.word.toUpperCase())}</div>`):`<div class="logo">🔒</div><h2>Роль скрыта</h2><p>Нажмите кнопку, когда никто не смотрит в ваш экран</p>`}
<p>Начинает: <b>${esc(m.first)}</b></p></div>
<div class="bot">${O.rev?(O.host?`<button class="pri" onclick="onlineStart()">НОВЫЙ РАУНД</button><button onclick="toLobby()">В лобби</button>`:`<p>Ждём главного…</p>`):`<button class="pri" onclick="O.show=!O.show;go('orole')">${O.show?"СКРЫТЬ РОЛЬ":"ПОКАЗАТЬ РОЛЬ"}</button>${O.host?`<button onclick="onlineReveal()">ПОКАЗАТЬ ОТВЕТ ВСЕМ</button>`:""}`}<button onclick="leave()">Выйти</button></div>`};
function share(){const l=location.href.split("#")[0]+"#"+O.code;if(navigator.share)navigator.share({title:"Импостер",text:"Заходи в игру! Код: "+O.code,url:l}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(l).then(()=>alert("Ссылка скопирована"));else prompt("Скопируйте ссылку",l)}
function showDbError(e){console.error(e);setErr(e.message||"Не удалось подключиться к бесплатной базе Firebase")}
async function makeRoom(){
  const nick=getNick();
  try{
    firebaseReady();await closeNet();setErr("Создаём комнату…");
    let code="",created=false;
    for(let i=0;i<8&&!created;i++){
      code=Array.from({length:4},()=>"ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[rnd(32)]).join("");
      const old=await dbGet("rooms/"+code);
      if(old===null){
        await dbPut("rooms/"+code,{host:myId,players:{[myId]:{name:nick,lastSeen:Date.now()}},state:{t:"lobby",round:0}});
        created=true;
      }
    }
    if(!created)throw new Error("Не получилось подобрать свободный код. Попробуйте ещё раз.");
    O={host:true,playerId:myId,peer:null,code,players:[{id:myId,name:nick}],list:[nick],phase:"lobby",R:0};
    startPolling();go("lobby");
  }catch(e){showDbError(e)}
}
async function joinRoom(pre){
  const nick=getNick(),code=(pre||(document.getElementById("cd")||{}).value||"").trim().toUpperCase();
  if(!/^[A-Z2-9]{4}$/.test(code))return setErr("Введите правильный 4-значный код комнаты");
  try{
    firebaseReady();await closeNet();setErr("Подключаемся…");
    const room=await dbGet("rooms/"+code);
    if(!room||!room.host)throw new Error("Комната не найдена. Проверьте код.");
    await dbPut("rooms/"+code+"/players/"+myId,{name:nick,lastSeen:Date.now()});
    O={host:false,playerId:myId,code,list:[],pre:null};
    startPolling();await pollRoom();
  }catch(e){showDbError(e)}
}
function startPolling(){
  stopPolling();
  pollTimer=setInterval(pollRoom,1200);
  heartbeatTimer=setInterval(()=>{if(O.code&&O.playerId)dbPatch("rooms/"+O.code+"/players/"+O.playerId,{lastSeen:Date.now()}).catch(()=>{})},7000);
}
async function pollRoom(){
  if(pollBusy||!O.code)return;pollBusy=true;
  try{
    const room=await dbGet("rooms/"+O.code);
    if(!room){stopPolling();O={list:[]};alert("Комната закрыта или удалена");go("onl");return}
    const players=room.players||{};
    O.players=Object.entries(players).map(([id,p])=>({id,name:p.name||"Игрок"}));
    O.list=O.players.map(p=>p.name);
    const playersKey=JSON.stringify(O.list);
    if(playersKey!==lastPlayersKey){lastPlayersKey=playersKey;if(CUR==="lobby")go("lobby")}
    if(!O.host){
      const hp=players[room.host];
      if(!hp||!hp.lastSeen||Date.now()-hp.lastSeen>30000){stopPolling();O={list:[]};alert("Главный игрок отключился, комната закрыта");go("onl");return}
    }
    if(O.host){
      const now=Date.now();
      for(const [id,p] of Object.entries(players)){
        if(id!==myId&&(!p.lastSeen||now-p.lastSeen>30000))await dbDelete("rooms/"+O.code+"/players/"+id);
      }
    }
    const state=room.state||{t:"lobby",round:0};
    const key=JSON.stringify(state);
    if(key!==lastStateKey){
      lastStateKey=key;
      if(state.t==="role"){
        const role=state.roles&&state.roles[myId];
        if(role){O.me=role;O.show=false;O.rev=false;O.R=state.round;go("orole")}
      }else if(state.t==="reveal"){
        O.ans=state.answer||null;O.rev=true;O.phase="lobby";
        if(CUR==="orole")go("orole");
      }else if(state.t==="lobby"){
        O.rev=false;O.phase="lobby";
        if(CUR==="onl"||CUR==="lobby"||CUR==="orole")go("lobby");
      }
    }else if(O.host&&CUR==="lobby"){
      // обновить список игроков, если кто-то вошёл/вышел
      const old=O._lastList||"";
      const nowList=JSON.stringify(O.list);
      if(old!==nowList){O._lastList=nowList;go("lobby")}
    }
    if(O.host&&CUR==="lobby")O._lastList=JSON.stringify(O.list);
  }catch(e){console.warn("Firebase poll:",e)}
  finally{pollBusy=false}
}
async function onlineStart(){
  if(!O.host||O.players.length<3)return;
  try{
    const w=pick(),emo=w.c?RAW[w.c][0]:"📍",imp=rnd(O.players.length),first=O.players[rnd(O.players.length)].name;
    O.R=(O.R||0)+1;O.ans={imp:O.players[imp].name,word:w.w};O.phase="play";
    const roles={};
    O.players.forEach((p,i)=>{roles[p.id]={imp:i===imp,word:i===imp?"":w.w,emo:i===imp?"":emo,first,round:O.R}});
    await dbPut("rooms/"+O.code+"/state",{t:"role",round:O.R,roles});
    O.me=roles[myId];O.show=false;O.rev=false;vib();go("orole");
  }catch(e){showDbError(e)}
}
async function onlineReveal(){
  if(!O.host||!O.ans)return;
  try{O.rev=true;O.phase="lobby";await dbPut("rooms/"+O.code+"/state",{t:"reveal",answer:O.ans,round:O.R});go("orole")}
  catch(e){showDbError(e)}
}
async function toLobby(){
  if(!O.host)return;
  try{await dbPut("rooms/"+O.code+"/state",{t:"lobby",round:O.R||0});O.rev=false;go("lobby")}
  catch(e){showDbError(e)}
}

const h0=location.hash.slice(1).toUpperCase();
if(/^[A-Z2-9]{4}$/.test(h0)){O.pre=h0;go("onl")}else go("mode");
